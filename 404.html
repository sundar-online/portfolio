<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 - Page Not Found | Sundaramoorthy</title>
    <link rel="shortcut icon" href="data/Logo.png" type="image/png" />
    <script>
      (function () {
        const savedTheme = localStorage.getItem("theme");
        const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
        const theme = savedTheme || (prefersDark ? "dark" : "light");
        document.documentElement.setAttribute("data-theme", theme);
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
    <script src="https://unpkg.com/lucide@latest" defer></script>
  </head>
  <body class="error-page" data-has-animated-bg="true">
    <!-- Global Neural Background Canvas -->
    <canvas id="bg"></canvas>

    <div class="page error-page-wrapper">
      <!-- Navbar injected here by script.js -->
      <div id="navbar-target"></div>

      <main class="error-main">
        <div class="glass-card error-card fade-up visible">
          <div class="error-badge">404</div>
          <h1 class="error-title">Page Not Found</h1>
          <p class="error-subtitle">
            The page you are looking for doesn't exist, has been moved, or is temporarily offline.
          </p>
          <div class="error-actions">
            <a href="index.html" class="btn btn-primary">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                <polyline points="9 22 9 12 15 12 15 22"></polyline>
              </svg>
              Back to Home
            </a>
            <a href="work.html" class="btn btn-secondary">
              View Work
            </a>
          </div>
        </div>
      </main>
    </div>

    <script type="module" src="script.js" defer></script>
  </body>
</html>
